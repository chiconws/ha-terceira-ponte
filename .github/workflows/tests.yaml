name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: >
          uv run --python 3.13 --no-project
          --with pytest-homeassistant-custom-component
          --with PyTurboJPEG
          python -m pytest
